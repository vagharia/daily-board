name: uselection
# US midterm results (Senate and House) from the Associated Press, every 3 minutes, for the pinned story.
# Each run does several rounds and then queues the next; it stops for good a day after the last race is called, and
# on 1 December in any case (engine/uselection.py).
on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine/uselection.py', '.github/workflows/uselection.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: uselection
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Results rounds
        id: rounds
        env:
          USELECTION_ROUNDS: '9'
          GIT_AUTHOR_NAME: board-bot
          GIT_AUTHOR_EMAIL: board-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: board-bot
          GIT_COMMITTER_EMAIL: board-bot@users.noreply.github.com
        run: python -m engine.uselection
      - name: Queue the next run
        if: steps.rounds.outputs.done != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run uselection.yml --ref "$GITHUB_REF_NAME" || echo "could not queue the next run"
