name: notice
# A one-off manual Telegram message (tools/notice.txt); runs only when started by hand.
on:
  workflow_dispatch:
    inputs:
      to:
        description: 'owner = only the owner; all = owner and every subscriber'
        required: true
        default: owner
        type: choice
        options: [owner, all]
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git fetch --depth 1 origin data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/notice.py "${{ inputs.to }}"
