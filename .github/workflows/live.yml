name: live
# Dollar, markets and news every 5 minutes. GitHub starts scheduled runs late and irregularly (at times not for an
# hour), so each run does several 5-minute rounds and, when it finishes, queues the next run itself; the schedule is
# only a fallback for when that chain breaks (a failed run doesn't queue another).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine/**', 'requirements.txt', '.github/workflows/live.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: live
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Live rounds
        env:
          DB_PUBLISH: '1'
          DB_LIVE_ROUNDS: '6'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.run_live
      - name: Queue the next run
        # it starts as soon as this one ends; at most one run waits in the queue, so this never piles up
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live.yml --ref "$GITHUB_REF_NAME" || echo "could not queue the next run"

