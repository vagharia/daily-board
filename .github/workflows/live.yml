name: live
# Dollar, markets and news every 5 minutes. GitHub starts scheduled runs late and irregularly,
# so each run does several 5-minute rounds and the schedule keeps a next run queued.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine/**', 'requirements.txt', '.github/workflows/live.yml']
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Live rounds
        env:
          DB_PUBLISH: '1'
          DB_LIVE_ROUNDS: '6'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.run_live
