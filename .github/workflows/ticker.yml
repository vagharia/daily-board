name: ticker
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine/dollar.py', 'engine/markets.py', 'engine/run_ticker.py', '.github/workflows/ticker.yml']
permissions:
  contents: write
concurrency:
  group: ticker
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run ticker
        env:
          DB_PUBLISH: '1'
          DB_TICKER_ROUNDS: '4'
        run: python -m engine.run_ticker
