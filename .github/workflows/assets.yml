name: assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_assets.py', '.github/workflows/assets.yml']
permissions:
  contents: write
concurrency:
  group: assets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download fonts and build the map
        run: python tools/build_assets.py fonts map
      - name: Commit assets
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add docs/fonts docs/assets
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "assets: fonts and map"
          git push origin HEAD:main
