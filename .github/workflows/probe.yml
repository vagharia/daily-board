name: probe
# temporary: find election results feeds (removed after use)
on:
  push:
    branches: [main]
    paths: ['tools/probe.py', '.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          mkdir out; cd out
          B=https://interactives.apelections.org/election-results/data-live/2026-11-03/results/national
          for f in progress metadata bop balance-of-power summary calls; do curl -s -o $f.json -w "$f %{http_code} %{size_download}\n" $B/$f.json; done
          for f in results/national/S results/national/H results/national/senate results/national/house results/US/bop; do n=$(echo $f | tr / _); curl -s -o $n.json -w "$f %{http_code} %{size_download}\n" https://interactives.apelections.org/election-results/data-live/2026-11-03/$f.json; done
          curl -s -o npr_bop.json -w "npr %{http_code}\n" https://apps.npr.org/2026-election-results/data/bop.json
          curl -s -o carto.json https://interactives.apelections.org/election-results/data-live/cycle-2026/maps/US/state/carto.json
          curl -sI https://interactives.apelections.org/election-results/data-live/2026-11-03/results/national/progress.json | grep -i "cache-control\|access-control\|last-modified"
      - uses: actions/upload-artifact@v4
        with:
          name: feeds
          path: out
