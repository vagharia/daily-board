name: probe
# temporary: find election results feeds (removed after use)
on:
  push:
    branches: [main]
    paths: ['tools/probe.py', '.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          mkdir out; cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          B=https://interactives.apelections.org/election-results/data-live/2026-11-03/results/national
          for f in progress metadata; do curl -s -A "$UA" -H "Referer: https://apnews.com/" -H "Origin: https://apnews.com" -o $f.json -w "$f %{http_code} %{size_download}\n" $B/$f.json || true; done
          curl -s -o npr_bop.json -w "npr %{http_code}\n" https://apps.npr.org/2026-election-results/data/bop.json || true
          curl -sI -A "$UA" -H "Referer: https://apnews.com/" $B/progress.json | head -20 || true
          ls -la
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feeds
          path: out
