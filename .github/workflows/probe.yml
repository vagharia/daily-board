name: probe
# temporary: find election results feeds (removed after use)
on:
  push:
    branches: [main]
    paths: ['tools/probe.py', '.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/probe.py https://apnews.com/projects/elections-2026/ https://apnews.com/projects/elections-2026/senate/ https://apps.npr.org/2026-election-results/ https://www.nytimes.com/interactive/2026/11/03/us/elections/results-senate.html
