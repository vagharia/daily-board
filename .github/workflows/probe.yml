name: probe
# temporary: find election results feeds (removed after use)
on:
  push:
    branches: [main]
    paths: ['tools/probe.py', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/out; cd /tmp/out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          B=https://interactives.apelections.org/election-results/data-live
          for f in 2026-11-03/results/national/progress 2026-11-03/results/national/metadata cycle-2026/maps/US/state/carto cycle-2026/maps/US/state/geo; do curl -s --compressed -A "$UA" -H "Referer: https://apnews.com/" -o $(basename $f).json -w "$f %{http_code} %{size_download}\n" $B/$f.json || true; done
          curl -s -o npr_bop.json https://apps.npr.org/2026-election-results/data/bop.json || true
          cd $GITHUB_WORKSPACE
          git config user.name board-bot; git config user.email board-bot@users.noreply.github.com
          git checkout --orphan probe-feeds; git rm -rqf .; cp /tmp/out/*.json .; git add *.json; git commit -qm feeds; git push -f origin probe-feeds
