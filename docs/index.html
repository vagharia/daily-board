<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07142B">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brief">
<title>Daily Brief</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css?v=7">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gHeat" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FFD23F"/><stop offset=".5" stop-color="#FF8A2A"/><stop offset="1" stop-color="#FF3D57"/>
    </linearGradient>
  </defs>
</svg>

<div id="lock" class="lock" hidden>
  <div class="lock-box">
    <svg class="ic ic-lg"><use href="#i-lock"/></svg>
    <p id="lockMsg" data-t="pinEnter"></p>
    <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <div class="pinpad" id="pinpad"></div>
  </div>
</div>

<header class="top" id="top">
  <div class="bar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M3.6 15.5a8.4 8.4 0 0 1 16.8 0" stroke-width="2.5"/><path d="M12 15.5l4.6-5.4" stroke-width="2.2"/><circle cx="12" cy="15.5" r="2.5" class="brand-dot" stroke="none"/></svg>
      <div class="brand-text">
        <strong data-t="app"></strong>
        <span id="updated" class="updated"></span>
      </div>
    </div>
    <div class="mini" id="mini" aria-hidden="true">
      <span class="mini-idx" id="miniIdx"></span>
      <span class="mini-usd" id="miniUsd"></span>
    </div>
    <div class="actions">
      <button class="lang" id="langBtn" aria-label="Language"><span data-l="fa">فا</span><span data-l="en">EN</span></button>
      <button class="icon-btn" id="settingsBtn" data-a="settings"><svg class="ic"><use href="#i-gear"/></svg></button>
    </div>
  </div>
</header>

<div class="ptr" id="ptr" aria-hidden="true"><svg class="ic"><use href="#i-refresh"/></svg></div>

<main id="app">
  <section class="panel" id="panel">
    <button class="markets" id="markets" data-a="markets" aria-describedby="marketsHint">
      <div class="mk" id="mkUsd"><span class="mk-l" data-t="usd"></span><b class="mk-v skel">—</b><span class="mk-c"></span></div>
      <div class="mk" id="mkBrent"><span class="mk-l" data-t="brent"></span><b class="mk-v skel">—</b><span class="mk-c"></span></div>
      <div class="mk" id="mkGold"><span class="mk-l" data-t="gold"></span><b class="mk-v skel">—</b><span class="mk-c"></span></div>
    </button>

    <button class="gauge-wrap" id="gauge" data-a="index">
      <div class="gauge-head">
        <span class="gauge-title" data-t="index"></span>
        <span class="gauge-zone" id="gaugeZone"></span>
        <span class="gauge-delta" id="gaugeDelta"></span>
        <b class="gauge-num" id="gaugeNum">—</b>
      </div>
      <div class="gauge" id="gaugeBar">
        <div class="g-track"></div>
        <div class="g-fill" id="gFill"><div class="g-heat"></div></div>
        <div class="g-ticks"><i style="--p:25"></i><i style="--p:50"></i><i style="--p:75"></i></div>
        <div class="g-needle" id="gNeedle"></div>
      </div>
      <div class="g-scale"><span data-t="z0"></span><span data-t="z1"></span><span data-t="z2"></span><span data-t="z3"></span></div>
    </button>

    <div class="lamps-wrap">
      <div class="lamps" id="lamps"></div>
      <button class="lamps-note" id="lampsNote" data-a="lights"></button>
    </div>

    <div class="flash" id="flash" hidden>
      <span class="flash-tag" data-t="breaking"></span>
      <div class="flash-viewport"><div class="flash-track" id="flashTrack"></div></div>
    </div>
  </section>

  <section class="pane" id="pane-news" data-pane="news">
    <div class="feed-controls">
      <div class="seg" id="rangeSeg" role="tablist">
        <button data-range="24h" data-t="r24"></button>
        <button data-range="week" data-t="rWeek"></button>
      </div>
      <div class="feed-tools">
        <button class="icon-btn" id="searchBtn" aria-label="search"><svg class="ic"><use href="#i-search"/></svg></button>
        <button class="icon-btn" id="filterBtn" data-a="filters" aria-label="filters"><svg class="ic"><use href="#i-sliders"/></svg><i class="badge-dot" id="filterDot" hidden></i></button>
      </div>
    </div>
    <div class="search" id="searchBox" hidden>
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search">
      <button class="icon-btn" id="searchClose"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="feed" id="feed"></div>
    <div class="sentinel" id="sentinel"></div>
  </section>

  <section class="pane" id="pane-map" data-pane="map" hidden>
    <div class="map-card">
      <div class="map-head">
        <div class="chips chips--flush" id="mapLayers"></div>
      </div>
      <div class="map" id="map"></div>
      <div class="map-legend" id="mapLegend"></div>
    </div>
    <div id="signals"></div>
  </section>

  <section class="pane" id="pane-x" data-pane="x" hidden>
    <div class="seg seg--wide" id="xSeg">
      <button data-seg="geo" data-t="xGeo"></button>
      <button data-seg="econ" data-t="xEcon"></button>
    </div>
    <p class="note" data-t="xNote"></p>
    <div id="xFeed" class="xfeed"></div>
  </section>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="news" class="on"><svg class="ic"><use href="#i-news"/></svg><span data-t="tNews"></span></button>
  <button data-tab="map"><svg class="ic"><use href="#i-radar"/></svg><span data-t="tMap"></span></button>
  <button data-tab="x"><svg class="ic"><use href="#i-quote"/></svg><span data-t="tX"></span></button>
</nav>

<div class="toast" id="toast" role="status" hidden></div>

<div class="sheet-layer" id="sheetLayer" hidden>
  <div class="sheet-scrim" data-close></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip" id="sheetGrip"><i></i></div>
    <button class="icon-btn sheet-x" data-close aria-label="close"><svg class="ic"><use href="#i-x"/></svg></button>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>

<script src="icons.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
